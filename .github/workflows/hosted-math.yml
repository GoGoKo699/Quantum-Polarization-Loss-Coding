name: Hosted mathematics

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/hosted-math.yml'

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAPTURE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch and verify the public capture scripts
        run: |
          helper_base='https://raw.githubusercontent.com/GoGoKo699/Quantum-Reference-Coupon-Collection/e3af02b56901937919b13ecb5ae25ca9959afdc8/verification/hosted_math'
          helper_dir="$RUNNER_TEMP/hosted-math-helpers"
          mkdir -p "$helper_dir"
          while read -r filename expected_sha; do
            curl --fail --silent --show-error --location --max-time 60 \
              "$helper_base/$filename" --output "$helper_dir/$filename"
            test "$(git hash-object "$helper_dir/$filename")" = "$expected_sha"
          done <<'HELPERS'
          capture_hosted_math.cjs a22129bf3e84145f16122045368ac9aee58acf3c
          check_rendered_math.py 1d3bf9810d0dfadb844a48b354af80f9b66924bc
          probe_hosted_math.cjs f83ea9da799bee0b53bd5c57315ae2b4b2d9de43
          HELPERS
      - name: Install the capture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Probe the overview
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node "$RUNNER_TEMP/hosted-math-helpers/probe_hosted_math.cjs" \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$CAPTURE_REVISION" \
            --page README.md \
            --output "$RUNNER_TEMP/hosted-math-probe"
      - name: Compare the rendered mathematics with source
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node "$RUNNER_TEMP/hosted-math-helpers/capture_hosted_math.cjs" \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$CAPTURE_REVISION" \
            --output "$RUNNER_TEMP/hosted-math"
      - name: Retain the figures and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-math-${{ env.CAPTURE_REVISION }}
          path: |
            ${{ runner.temp }}/hosted-math-probe
            ${{ runner.temp }}/hosted-math
          if-no-files-found: error
          retention-days: 14
